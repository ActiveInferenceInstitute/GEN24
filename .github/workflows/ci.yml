name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Run the test suite
        # The parser-level GNN test skips here; the named conformance job below
        # provisions the pinned checkout and runs it with GNN_ROOT set.
        run: python -m pytest tests/ -q

  gnn-conformance:
    name: gnn conformance (pinned)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Fetch the pinned GNN checkout
        run: |
          set -euo pipefail
          PIN=NHIM/gnn-pin.json
          REPO=$(python -c "import json;print(json.load(open('$PIN'))['repository'])")
          TAG=$(python -c "import json;print(json.load(open('$PIN'))['release'])")
          COMMIT=$(python -c "import json;print(json.load(open('$PIN'))['commit'])")
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/${REPO}.git" "$RUNNER_TEMP/gnn"
          git -C "$RUNNER_TEMP/gnn" checkout --quiet "$COMMIT"
          # The validator also checks the release tag; require it to peel to the pin.
          test "$(git -C "$RUNNER_TEMP/gnn" rev-parse "${TAG}^{commit}")" = "$COMMIT"

      - name: Validate the GNN specification against the pinned parser
        run: python scripts/validate_gnn_spec.py --gnn-root "$RUNNER_TEMP/gnn" --require-gnn

      - name: Run the GNN conformance tests
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: python -m pytest -q tests/test_gnn_spec.py

      - name: Report the resolved GNN version
        run: |
          PIN=NHIM/gnn-pin.json
          VERSION=$(python3 -c "import json;print(json.load(open('$PIN'))['release'].removeprefix('v'))")
          test -n "$VERSION"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
