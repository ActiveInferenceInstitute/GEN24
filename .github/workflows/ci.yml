name: CI

# Every gate step below is an arm of ./run.sh. Do not inline a second copy of a
# command here: a local `./run.sh` and this workflow must run the same thing.
# Reference: docs/RUN_GUIDE.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One pinned setup path for both jobs; the cache is keyed on the single
      # dependency definition, so the gnn job reuses what this job resolved.
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
          cache-dependency-glob: "requirements-dev.txt"
          activate-environment: "true"

      - name: Install test dependencies
        run: uv pip install -r requirements-dev.txt

      - name: lint
        run: ./run.sh lint

      - name: test
        run: ./run.sh test

      - name: docs
        run: ./run.sh docs

  gnn-conformance:
    name: gnn conformance (pinned)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
          cache-dependency-glob: "requirements-dev.txt"
          activate-environment: "true"

      - name: Install test dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Fetch the pinned GNN checkout
        # The validator reads the pinned commit with `git show` and `git archive`,
        # so no worktree checkout is needed. It also verifies the commit, the
        # release tag and every recorded parser hash itself.
        run: |
          set -euo pipefail
          REPO=$(python -c "import json;print(json.load(open('NHIM/gnn-pin.json'))['repository'])")
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/${REPO}.git" "$RUNNER_TEMP/gnn"

      - name: gnn
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: ./run.sh gnn

      - name: Report the resolved GNN version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('NHIM/gnn-pin.json'))['release'].removeprefix('v'))")
          test -n "$VERSION"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
